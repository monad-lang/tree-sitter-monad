[package]
name = "tree-sitter-monad"
description = "Parser for the Monad language"
version = "0.2.0"
authors = ["Anders Christiansen Sørby <anders@sorby.xyz>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "monad"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://tangled.org/monad-lang.org/tree-sitter-monad"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26"
