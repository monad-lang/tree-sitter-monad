name: Test

# Pull requests run the tests directly; pushes to main are tested by the
# Release workflow (release.yml) reusing this workflow, so a push to
# main doesn't run the suite twice.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Generate parser and run corpus tests
        run: devenv test
